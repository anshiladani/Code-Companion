services:
  - type: web
    name: code-companion
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: code-companion-db
          property: connectionString
      - key: ENABLE_LOCAL_CODE_EXECUTION
        value: "false"

databases:
  - name: code-companion-db
    databaseName: code_companion_db
    user: code_companion
    plan: free
    region: oregon
    ipAllowList: []
